syntax = "proto3";

package screen.v1;

option go_package = "github.com/aneeshpatne/atlas/gen/screen/v1;screenv1";

// NewsItem mirrors the canonical news.Story shape used by Atlas.
message NewsItem {
  string story_id = 1;
  string event_id = 2;
  string title = 3;
  string description = 4;
  string genre = 5;
  repeated Source sources = 6;
}

message Source {
  string url = 1;
  string domain = 2;
  string og_url = 3;
}
